# Render配置文件
# https://render.com/docs/static-sites

# 项目信息
name: recruitment-heatmap-dashboard
region: oregon

# 静态网站配置
type: static
buildCommand: "npm install && npm run build"
publishPath: "dist"

# 环境变量
envVars:
  - key: NODE_ENV
    value: production

